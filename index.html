<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ОЧИСТКА</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

/* Сброс стилей для новых кнопок */
button {
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
    text-align: left;
}

:root {
    --accent: #60a5fa;
    --accent2: #3b82f6;
    --bg1: #050816;
    --bg2: #09111f;
    --sub: rgba(255,255,255,.55);
}

html {
    background-color: #050816; 
}

body {
    min-height: 100vh; /* Фолбэк для старых устройств */
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Inter', sans-serif;
    color: white;
    transition: background 1s ease;
    background-attachment: fixed;
    background-image: 
        radial-gradient(circle at top, var(--accent2) 0%, transparent 40%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
}

/* MODES COLORS */
body.water { --accent:#60a5fa; --accent2:#2563eb; --bg1:#050816; --bg2:#09111f; }
body.bass { --accent:#a855f7; --accent2:#7c3aed; --bg1:#12081c; --bg2:#170f2c; }
body.smart { --accent:#22c55e; --accent2:#16a34a; --bg1:#07130d; --bg2:#0f1d14; }

/* AMBIENT & PARTICLES */
.ambient {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.light {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .16;
    transform: translateZ(0);
    transition: background 1s ease;
    animation: float 18s infinite ease-in-out;
}

.light.one { background: var(--accent2); top: -100px; left: -100px; }
.light.two { background: var(--accent); right: -80px; bottom: -80px; animation-delay: 6s; }

@keyframes float {
    0%, 100% { transform: translate(0,0) translateZ(0); }
    50% { transform: translate(30px,-40px) translateZ(0); }
}

#particles-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* APP CONTAINER */
.app {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
    padding-bottom: env(safe-area-inset-bottom, 16px);
}

/* ISLAND & TIMER */
.island {
    width: 126px;
    height: 36px;
    margin: 4px auto 16px;
    border-radius: 30px;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1);
    transform: translateZ(0);
}

.island.active { width: 250px; height: 80px; }
.island-inner { opacity: 0; transform: translateY(10px); transition: .4s; }
.island.active .island-inner { opacity: 1; transform: translateY(0); }

.live {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: .4; }
}

.timer-text { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }

/* HEADER */
.header { margin-bottom: 14px; }
.logo h1 { 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    font-weight: 900; 
    font-size: 38px; 
    letter-spacing: -1px; 
    text-transform: uppercase; 
}
.logo p { font-size: 13px; color: var(--sub); margin-top: 2px; }

/* HERO CARD & GLASS */
.glass {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.05);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.3);
    overflow: hidden;
    transform: translateZ(0);
}

.hero { border-radius: 32px; padding: 22px; margin-bottom: 16px; }

/* ORB BUTTON */
.orb-wrap { display: flex; justify-content: center; margin: 14px 0 22px; }

.orb {
    position: relative;
    width: 175px; height: 175px;
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 0 25px rgba(255,255,255,.03), 0 0 50px color-mix(in srgb, var(--accent) 25%, transparent);
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 1s ease;
    will-change: transform;
}

.orb.active { animation: breathe 2s infinite ease-in-out; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.orb::before { content: ''; position: absolute; width: 215px; height: 215px; border-radius: 50%; border: 1px solid rgba(255,255,255,.03); }
.orb h2 { font-size: 30px; letter-spacing: -1px; position: relative; z-index: 2; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; }

/* VISUALIZER & SLIDER */
.visualizer { width: 100%; height: 60px; margin-bottom: 18px; pointer-events: none; }
.control { margin-bottom: 20px; }
.control label { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--sub); }

.slider { width: 100%; appearance: none; height: 6px; border-radius: 20px; background: linear-gradient(90deg, var(--accent) 65%, rgba(255,255,255,.08) 65%); }
.slider::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; border-radius: 50%; background: white; border: 4px solid rgba(255,255,255,.1); }

/* MODES CARDS (Теперь это кнопки) */
.modes { display: flex; gap: 8px; margin-bottom: 16px; }
.mode { flex: 1; padding: 12px; border-radius: 20px; transition: transform .3s, background .3s, border .3s; }
.mode.active { background: rgba(255,255,255,.08); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 15%, transparent); }
.mode h4 { margin-bottom: 4px; font-size: 14px; font-weight: 600; }
.mode p { font-size: 11px; line-height: 1.3; color: var(--sub); }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { padding: 12px 6px; border-radius: 18px; text-align: center; }
.card h3 { font-size: 16px; margin-bottom: 2px; font-weight: 700; }
.card p { font-size: 11px; color: var(--sub); }

/* BOTTOM SECTION & DOCK (Кнопки) */
.bottom-section { margin-top: 10px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; }

.dock {
    display: flex; gap: 8px; padding: 8px; border-radius: 28px; width: 100%;
}
.dock-item {
    flex: 1; height: 46px; border-radius: 20px; display: flex; justify-content: center; align-items: center;
    font-size: 14px; font-weight: 600; color: rgba(255,255,255,.5); transition: all .3s ease;
}
.dock-item.active { color: white; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.05); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 15%, transparent); }

.developer-signature { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 16px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.homebar { width: 110px; height: 4px; border-radius: 30px; background: rgba(255,255,255,.2); margin: 12px auto 8px; }

/* FLASH EFFECT */
.flash { position: fixed; inset: 0; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 25%, transparent), transparent 75%); pointer-events: none; opacity: 0; z-index: 20; }
.flash.active { animation: flash .6s ease; }
@keyframes flash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body class="water">

<div class="flash" id="flash"></div>

<div class="ambient">
    <div class="light one"></div>
    <div class="light two"></div>
    <canvas id="particles-canvas"></canvas>
</div>

<div class="app">
    <div class="island" id="island">
        <div class="island-inner">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="live"></div>
                <div>
                    <div style="font-size:13px; font-weight:600; display:flex; justify-content:space-between; width: 140px;">
                        <span>Очистка</span>
                        <span id="timerDisplay" class="timer-text">02:00</span>
                    </div>
                    <div id="islandText" style="font-size:11px; opacity:.6;">Режим: Вода</div>
                </div>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <h1>Очистка</h1>
            <p>Жидкая очистка динамика</p>
        </div>
    </div>

    <div class="hero glass">
        <div class="orb-wrap">
            <button class="orb" id="orb" type="button">
                <h2 id="buttonText">СТАРТ</h2>
            </button>
        </div>

        <canvas class="visualizer" id="visualizer"></canvas>

        <div class="control">
            <label>
                <span>Частота</span>
                <span id="freq">165Гц</span>
            </label>
            <input type="range" class="slider" id="slider" min="0" max="300" value="165">
        </div>

        <div class="modes">
            <button class="mode glass active" data-mode="water" type="button">
                <h4>Вода</h4>
                <p>Выталкивание влаги</p>
            </button>
            <button class="mode glass" data-mode="bass" type="button">
                <h4>Бас</h4>
                <p>Низкие частоты</p>
            </button>
            <button class="mode glass" data-mode="smart" type="button">
                <h4>Умный</h4>
                <p>AI очистка</p>
            </button>
        </div>

        <div class="stats">
            <div class="card glass">
                <h3>98%</h3>
                <p>Мощность</p>
            </div>
            <div class="card glass">
                <h3 id="statFreq">250Гц</h3>
                <p>Максимум</p>
            </div>
            <div class="card glass">
                <h3 id="statType">Мягко</h3>
                <p>Адаптация</p>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="dock glass">
            <button class="dock-item active" data-target="water" type="button">Очистка</button>
            <button class="dock-item" data-target="bass" type="button">Усиление</button>
            <button class="dock-item" data-target="water" type="button">Вода</button>
            <button class="dock-item" data-target="smart" type="button">Умный</button>
        </div>
        <div class="developer-signature">Разработчик EGORKIN</div>
        <div class="homebar"></div>
    </div>
</div>

<script>
/* =========================
   БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ TELEGRAM
========================= */
let tg = null;
try {
    if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        if (tg.expand) tg.expand();
    }
} catch (e) {
    console.log("Telegram WebApp не найден или ошибка инициализации");
}

/* =========================
   AUDIO & DATA LOGIC
========================= */
let audioContext = null;
let oscillator = null;
let gainNode = null;

let playing = false;
let currentMode = 'water';
let timerInterval;
let timeLeft = 120; // 2 минуты

const modeSettings = {
    water: { minF: 100, maxF: 250, type: 'sine', step: 0.4, label: 'Вода', stat: 'Мягко' },
    bass:  { minF: 30,  maxF: 100, type: 'triangle', step: 0.2, label: 'Бас', stat: 'Глубоко' },
    smart: { minF: 50,  maxF: 300, type: 'sawtooth', step: 0.8, label: 'Умный', stat: 'Агрес.' }
};

const orb = document.getElementById('orb');
const island = document.getElementById('island');
const buttonText = document.getElementById('buttonText');
const slider = document.getElementById('slider');
const freq = document.getElementById('freq');
const islandText = document.getElementById('islandText');
const statFreq = document.getElementById('statFreq');
const statType = document.getElementById('statType');
const flash = document.getElementById('flash');
const timerDisplay = document.getElementById('timerDisplay');

// Безопасное чтение из Cloud Storage
if (tg && tg.CloudStorage) {
    try {
        tg.CloudStorage.getItem('savedMode', function(err, value) {
            if (!err && value && modeSettings[value]) {
                switchMode(value, false);
            }
        });
    } catch(e) {}
}

function triggerHaptic(style) {
    if (!style) style = 'light';
    try {
        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred(style);
        } else if (navigator.vibrate) {
            navigator.vibrate(style === 'heavy' ? [50] : [20]);
        }
    } catch(e) {}
}

function formatTime(seconds) {
    let m = Math.floor(seconds / 60).toString();
    let s = (seconds % 60).toString();
    if (m.length < 2) m = '0' + m;
    if (s.length < 2) s = '0' + s;
    return m + ':' + s;
}

function updateSliderUI(val) {
    freq.innerText = Math.floor(val) + 'Гц';
    let percent = (val / slider.max) * 100;
    slider.style.background = 'linear-gradient(90deg, var(--accent) ' + percent + '%, rgba(255,255,255,.08) ' + percent + '%)';
}

// Привязываем и input, и change для старых устройств
['input', 'change'].forEach(function(evt) {
    slider.addEventListener(evt, function() {
        updateSliderUI(slider.value);
        if (oscillator && playing) {
            oscillator.frequency.value = Number(slider.value);
        }
    });
});

function switchMode(modeName, haptic) {
    if (currentMode === modeName) return;
    
    currentMode = modeName;
    document.body.className = currentMode;
    
    document.querySelectorAll('.mode').forEach(function(m) {
        if (m.getAttribute('data-mode') === currentMode) {
            m.classList.add('active');
        } else {
            m.classList.remove('active');
        }
    });
    
    document.querySelectorAll('.dock-item').forEach(function(t) {
        if (t.getAttribute('data-target') === currentMode) {
            t.classList.add('active');
        } else {
            t.classList.remove('active');
        }
    });

    let settings = modeSettings[currentMode];
    islandText.innerText = 'Режим: ' + settings.label;
    statFreq.innerText = settings.maxF + 'Гц';
    statType.innerText = settings.stat;
    
    if (tg && tg.CloudStorage) {
        try { tg.CloudStorage.setItem('savedMode', currentMode); } catch(e) {}
    }

    if (playing) {
        stopAudio(true);
        setTimeout(startAudio, 50); 
    }

    flash.classList.remove('active');
    void flash.offsetWidth; 
    flash.classList.add('active');
}

function startAudio() {
    let AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return; // Защита от браузеров без звука

    if (!audioContext) {
        audioContext = new AudioCtx();
    }
    if (audioContext.state === 'suspended') {
        audioContext.resume();
    }

    oscillator = audioContext.createOscillator();
    gainNode = audioContext.createGain();

    let settings = modeSettings[currentMode];
    oscillator.type = settings.type;
    
    if (slider.value < settings.minF || slider.value > settings.maxF) {
        slider.value = (settings.minF + settings.maxF) / 2;
    }
    
    oscillator.frequency.value = Number(slider.value);
    
    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.25, audioContext.currentTime + 0.3);

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.start();
}

function stopAudio(immediate) {
    if (oscillator && gainNode) {
        const stopTime = audioContext.currentTime + (immediate ? 0.05 : 0.3);
        gainNode.gain.setValueAtTime(gainNode.gain.value, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, stopTime);
        
        oscillator.stop(stopTime);
        setTimeout(function() {
            if(oscillator) oscillator.disconnect();
            oscillator = null;
        }, (immediate ? 50 : 300));
    }
}

function stopProcess() {
    stopAudio(false);
    clearInterval(timerInterval);
    playing = false;
    orb.classList.remove('active');
    island.classList.remove('active');
    buttonText.innerText = 'СТАРТ';
    timeLeft = 120;
    timerDisplay.innerText = formatTime(timeLeft);
    triggerHaptic('heavy');
}

// Слушатель для главной кнопки
orb.addEventListener('click', function(e) {
    e.preventDefault();
    triggerHaptic('heavy');
    if (!playing) {
        startAudio();
        orb.classList.add('active');
        island.classList.add('active');
        buttonText.innerText = 'СТОП';
        playing = true;
        
        timerInterval = setInterval(function() {
            timeLeft--;
            timerDisplay.innerText = formatTime(timeLeft);
            if(timeLeft <= 0) stopProcess();
        }, 1000);

    } else {
        stopProcess();
    }
});

// КЛИКИ: Центральные карточки режимов
document.querySelectorAll('.mode').forEach(function(mode) {
    mode.addEventListener('click', function(e) {
        e.preventDefault();
        triggerHaptic('medium');
        switchMode(mode.getAttribute('data-mode'), true);
    });
});

// КЛИКИ: Нижний бар (Dock)
document.querySelectorAll('.dock-item').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
        e.preventDefault();
        triggerHaptic('light');
        switchMode(tab.getAttribute('data-target'), true);
    });
});

/* =========================
   VISUALIZER 
========================= */
const visCanvas = document.getElementById('visualizer');
const visCtx = visCanvas.getContext('2d');

function resizeVisCanvas() {
    visCanvas.width = visCanvas.offsetWidth;
    visCanvas.height = visCanvas.offsetHeight;
}
resizeVisCanvas();
window.addEventListener('resize', resizeVisCanvas);

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    visCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
    
    const bars = 36;
    const gap = 10;
    let speedMult = currentMode === 'bass' ? 110 : (currentMode === 'smart' ? 75 : 170);

    for (let i = 0; i < bars; i++) {
        let wave = playing ? Math.sin(Date.now() / speedMult + i * 0.45) * 16 + 24 : 6;
        let x = i * gap + 6;
        let y = visCanvas.height / 2 - wave / 2;
        
        let gradient = visCtx.createLinearGradient(0, 0, 0, visCanvas.height);
        gradient.addColorStop(0, 'rgba(255,255,255,0.95)');
        gradient.addColorStop(1, getComputedStyle(document.body).getPropertyValue('--accent'));
        
        visCtx.fillStyle = gradient;
        visCtx.beginPath();
        visCtx.roundRect(x, y, 4.5, wave, 10);
        visCtx.fill();
    }
}
drawVisualizer();

/* =========================
   PARTICLES (Капли/Пыль)
========================= */
const partCanvas = document.getElementById('particles-canvas');
const pCtx = partCanvas.getContext('2d');
let particles = [];

function resizePartCanvas() {
    partCanvas.width = window.innerWidth;
    partCanvas.height = window.innerHeight;
}
resizePartCanvas();
window.addEventListener('resize', resizePartCanvas);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = partCanvas.width / 2 + (Math.random() - 0.5) * 100;
        this.y = partCanvas.height / 2 - 100 + (Math.random() - 0.5) * 100;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 2 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 3 + 1;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.01;
    }
    update() {
        if (!playing) {
            this.life -= 0.05;
        } else {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.05;
            this.life -= this.decay;
        }
        if (this.life <= 0 && playing) this.reset();
    }
    draw() {
        if (this.life > 0) {
            pCtx.fillStyle = 'rgba(255, 255, 255, ' + (this.life * 0.5) + ')';
            pCtx.beginPath();
            pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            pCtx.fill();
        }
    }
}

for(let i = 0; i < 40; i++) particles.push(new Particle());

function drawParticles() {
    requestAnimationFrame(drawParticles);
    pCtx.clearRect(0, 0, partCanvas.width, partCanvas.height);
    
    if (playing || particles.some(function(p) { return p.life > 0; })) {
        particles.forEach(function(p) {
            p.update();
            p.draw();
        });
    }
}
drawParticles();

/* =========================
   AUTO SWEEP
========================= */
let lastDomUpdate = 0;
setInterval(function() {
    if (playing) {
        let settings = modeSettings[currentMode];
        let value = Number(slider.value);
        
        value += settings.step;
        if (value > settings.maxF) {
            value = settings.minF; 
        }

        slider.value = value;
        if (oscillator) {
            oscillator.frequency.value = value;
        }

        let now = Date.now();
        if (now - lastDomUpdate > 100) {
            updateSliderUI(value);
            lastDomUpdate = now;
        }
    }
}, 35);
</script>
</body>
</html>
